<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users - M-Unite Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo-box">M</div>
  <nav>
    <a href="admin-home.html">&#127968; Home</a>
    <a href="admin-users.html" class="active">&#128101; Users</a>
    <a href="admin-content.html">&#128196; Content</a>
    <a href="admin-monitor.html">&#128737;&#65039; Monitoring</a>
  </nav>
  <span class="account-btn"><a href="admin-account.html">&#128100; My Account</a></span>
</header>

<main class="wide">
  <h1>User Management</h1>
  <p class="page-intro">Approve new registrations, assign roles, or remove accounts.</p>

  <div class="stats-grid">
    <div class="stat-card"><div class="num" id="stat-total">0</div><div class="label">Total Users</div></div>
    <div class="stat-card"><div class="num" id="stat-pending">0</div><div class="label">Pending</div></div>
    <div class="stat-card"><div class="num" id="stat-approved">0</div><div class="label">Approved</div></div>
  </div>

  <section>
    <h2>&#10133; Register New User</h2>
    <form id="add-form">
      <label>Full name:
        <input type="text" id="new-name" required>
      </label>
      <label>Role:
        <select id="new-role">
          <option>Community Member</option>
          <option>Ward Councillor</option>
          <option>Municipal Officer</option>
        </select>
      </label>
      <button type="submit">Add User</button>
    </form>
  </section>

  <section>
    <h2>&#128101; All Users</h2>
    <div class="toolbar">
      <input type="text" id="search-input" placeholder="Search by name...">
      <select id="status-filter">
        <option value="all">All statuses</option>
        <option value="Pending">Pending</option>
        <option value="Approved">Approved</option>
      </select>
    </div>
    <ul id="user-list" class="item-list"></ul>
    <p class="empty-msg" id="empty-msg" style="display:none;">No users match your search.</p>
  </section>
</main>

<footer>&copy; M-Unite 2026 - System Administrator Portal</footer>

<script src="nav.js"></script>
<script src="admin-users.js"></script>
</body>
</html>
