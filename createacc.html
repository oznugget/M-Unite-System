<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USER REGISTRATION FORM</title>

      <link rel="stylesheet" href="createacccss.css">
</head>
<body>

  <div class="registration">
    <h2>Create Account</h2>

    <form class="reg-form" action="registration.php" method="POST">

      <div class="form-group">
        <label for="firstname">First Name</label>
        <input type="text" id="firstname" name="firstname" maxlength="50" required />
      </div>

      <div class="form-group">
        <label for="surname">Surname</label>
        <input type="text" id="surname" name="surname" maxlength="50" required />
      </div>

      <div class="form-group">
        <label for="addr">Physical Address</label>
        <textarea id="addr" name="addr" rows="3"></textarea>
      </div>

      <div class="form-group">
        <label for="contact">Contact</label>
        <input type="tel" id="contact" name="contact" maxlength="15" required />
      </div>

      <div class="form-group">
        <label for="urole">User Role</label>
        <select id="urole" name="userrole">
          <option value="">Select role</option>
          <option value="1">Resident</option>
          <option value="2">Ward Councillor</option>
          <option value="3">Municipal Officer</option>
          <option value="4">Systems Administrator</option>
        </select>
      </div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" maxlength="35" required />
      </div>

      <div class="form-group">
        <label for="pword">Password</label>
        <input type="password" id="pword" name="pword" maxlength="35" required />
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Account</button>
        <button type="reset" class="btn btn-secondary">Clear Form</button>
      </div>

    </form>
  </div>

</body>
</html>
